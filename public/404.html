<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>// AI PRODUCT MANAGER</title>
    <script>
      // GitHub Pages SPA redirect
      // Saves the current path to sessionStorage then redirects to root
      var path = window.location.pathname;
      sessionStorage.setItem('spa_redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
